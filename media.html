<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>John Nuzzi Media</title>
<meta name="description" content="Every photo and video of John Nuzzi in one place.">
<meta name="theme-color" content="#C7E0EE">
<link rel="icon" href="brand/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="brand/apple-touch-icon-180.png">
<link rel="stylesheet" href="css/site.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="media-page">

<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="./">John Nuzzi</a>
    <nav class="nav" aria-label="Main">
      <a href="./">Home</a>
      <a href="media.html" aria-current="page">Media</a>
      <a href="next.html">Plan</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-head">
    <div class="wrap media-head">
      <div>
        <h1>Every photo. Every video.</h1>
        <p class="lede" id="summary">Solos, groups, class and rehearsal, all in one place.</p>
      </div>
      <button class="btn add-btn" id="add-open" hidden>Add photos or videos</button>
    </div>
  </section>

  <div class="toolbar">
    <div class="wrap"><div class="chips" id="chips" role="group" aria-label="Filter"></div></div>
  </div>

  <section class="wrap">
    <div id="grid"></div>
    <p class="empty" id="empty" hidden>Nothing here yet.</p>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span class="wordmark">John Nuzzi</span>
    <p><a href="https://www.instagram.com/johnnuzzi_dance/">Instagram @johnnuzzi_dance</a></p>
    <p>Trained with DWD ProSeries, Orlando</p>
  </div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/viewer.js"></script>
<script src="js/uploads.js"></script>
<script src="js/media.js"></script>
</body>
</html>
