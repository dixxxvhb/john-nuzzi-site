    <ellipse cx="0" cy="-7" rx="2.5" ry="5" fill="#6366A0" transform="rotate(0)"/>
    <ellipse cx="0" cy="-7" rx="2.5" ry="5" fill="#6366A0" transform="rotate(45)"/>
    <ellipse cx="0" cy="-7" rx="2.5" ry="5" fill="#6366A0" transform="rotate(90)"/>
