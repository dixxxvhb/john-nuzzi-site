<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Main vine curving from bottom-left to top-right -->
  <path d="M10,110 C15,90 20,75 30,62 C40,49 52,40 65,30 C78,20 92,15 110,10"
        stroke="#6366A0" stroke-width="1" opacity="0.22" fill="none" stroke-linecap="round"/>

  <!-- Secondary tendril branch -->
  <path d="M35,60 C30,52 26,46 22,38"
        stroke="#3B5998" stroke-width="0.7" opacity="0.18" fill="none" stroke-linecap="round"/>
  <path d="M65,30 C72,24 78,18 82,12"
        stroke="#3B5998" stroke-width="0.7" opacity="0.18" fill="none" stroke-linecap="round"/>

  <!-- Center flower at curve midpoint (~55,52) -->
  <g transform="translate(55,52)" opacity="0.28">
    <ellipse cx="0" cy="-6" rx="2.2" ry="4.5" fill="#6366A0" transform="rotate(0)"/>
    <ellipse cx="0" cy="-6" rx="2.2" ry="4.5" fill="#6366A0" transform="rotate(60)"/>
    <ellipse cx="0" cy="-6" rx="2.2" ry="4.5" fill="#6366A0" transform="rotate(120)"/>
    <ellipse cx="0" cy="-6" rx="2.2" ry="4.5" fill="#6366A0" transform="rotate(180)"/>
    <ellipse cx="0" cy="-6" rx="2.2" ry="4.5" fill="#6366A0" transform="rotate(240)"/>
    <ellipse cx="0" cy="-6" rx="2.2" ry="4.5" fill="#6366A0" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="2.5" fill="#3B5998"/>
  </g>

  <!-- Leaves along the vine -->
  <!-- Lower section leaves -->
  <ellipse cx="20" cy="90" rx="6" ry="3" fill="#6366A0" opacity="0.2" transform="rotate(-50,20,90)"/>
  <ellipse cx="30" cy="75" rx="5.5" ry="2.8" fill="#3B5998" opacity="0.17" transform="rotate(-42,30,75)"/>
  <ellipse cx="42" cy="63" rx="5.5" ry="2.8" fill="#6366A0" opacity="0.2" transform="rotate(-35,42,63)"/>

  <!-- Upper section leaves -->
  <ellipse cx="70" cy="40" rx="5.5" ry="2.8" fill="#3B5998" opacity="0.17" transform="rotate(-25,70,40)"/>
  <ellipse cx="83" cy="28" rx="5" ry="2.5" fill="#6366A0" opacity="0.2" transform="rotate(-18,83,28)"/>
  <ellipse cx="98" cy="18" rx="5" ry="2.5" fill="#3B5998" opacity="0.17" transform="rotate(-12,98,18)"/>

  <!-- Small buds -->
  <ellipse cx="25" cy="82" rx="1.8" ry="2.8" fill="#6366A0" opacity="0.22" transform="rotate(-50,25,82)"/>
  <ellipse cx="48" cy="56" rx="1.8" ry="2.8" fill="#3B5998" opacity="0.2" transform="rotate(-30,48,56)"/>
  <ellipse cx="75" cy="33" rx="1.8" ry="2.6" fill="#6366A0" opacity="0.22" transform="rotate(-18,75,33)"/>

  <!-- Tiny dot accents -->
  <circle cx="14" cy="100" r="1.2" fill="#6366A0" opacity="0.18"/>
  <circle cx="100" cy="14" r="1.2" fill="#6366A0" opacity="0.18"/>
</svg>
