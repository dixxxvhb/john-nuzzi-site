<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -200 540 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="John — animated wordmark">
  <title>John — Stamp Slam animated wordmark</title>
  <defs>
    <style><![CDATA[
      /* John Nuzzi — Animated wordmark · "Stamp Slam" · locked 2026-05-26
         Loop: J draws on (stroke), butter fill appears, stroke fades to invisible,
         then "ohn" SLAMS in — brown shadow overshoots, butter flashes in.  5s loop. */

      .glyph-fill   { fill: #F5E6A0; stroke: #3D2817; stroke-width: 2;
                      stroke-dasharray: 952; stroke-dashoffset: 952; fill-opacity: 0; }
      .glyph-shadow { fill: #3D2817; }

      .ohn-fill   { fill: #F5E6A0; stroke: none; opacity: 0; }
      .ohn-shadow { fill: #3D2817; opacity: 0; }

      .j-fill   { animation: jDrawFill 5s ease-out infinite; }
      .j-shadow { opacity: 0; animation: jShadowIn 5s ease-out infinite; }

      .ohn-group { transform: translate(128.64px, 0px); }
      .ohn-fill   { animation: ohnFill   5s ease-out infinite; }
      .ohn-shadow { animation: ohnShadow 5s ease-out infinite; }

      @keyframes jDrawFill {
        0%   { stroke-dashoffset: 952; fill-opacity: 0; stroke-opacity: 1; }
        35%  { stroke-dashoffset: 0;   fill-opacity: 0; stroke-opacity: 1; }
        44%  { stroke-dashoffset: 0;   fill-opacity: 1; stroke-opacity: 1; }
        55%  { stroke-dashoffset: 0;   fill-opacity: 1; stroke-opacity: 0; }
        100% { stroke-dashoffset: 0;   fill-opacity: 1; stroke-opacity: 0; }
      }
      @keyframes jShadowIn {
        0%, 40%   { opacity: 0; }
        48%, 100% { opacity: 1; }
      }
      @keyframes ohnShadow {
        0%, 50% { opacity: 0; transform: translate(0px, -50px) scale(1.4); }
        56%     { opacity: 1; transform: translate(0px, 6px)   scale(1); }
        60%     { opacity: 1; transform: translate(0px, 0px)   scale(1); }
        100%    { opacity: 1; transform: translate(0px, 0px)   scale(1); }
      }
      @keyframes ohnFill {
        0%, 56% { opacity: 0; transform: scale(1.4); }
        62%     { opacity: 1; transform: scale(1); }
        100%    { opacity: 1; transform: scale(1); }
      }

      /* Accessibility — flatten to static final state */
      @media (prefers-reduced-motion: reduce) {
        .j-fill, .j-shadow, .ohn-fill, .ohn-shadow { animation: none; }
        .j-fill   { stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 0; }
        .j-shadow { opacity: 1; }
        .ohn-fill, .ohn-shadow { opacity: 1; transform: none; }
      }
    ]]></style>
  </defs>

